<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b2ecf7"/>
      <stop offset="1" stop-color="#e8faff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#78bed7"/>
    </pattern>
    <clipPath id="textclip"><text x="800" y="170" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="120" letter-spacing="10">AURALYRIC</text></clipPath>
  </defs>
  <style>
    .dots { animation: drift 14s linear infinite; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(22px,22px); } }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .t2 { animation-delay: -1.1s; } .t3 { animation-delay: -2.2s; }
    @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
    .title { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .sub { animation: rise 1.2s .25s cubic-bezier(.2,.8,.2,1) both; }
    .sweep { animation: sweep 3.6s ease-in-out 1.4s infinite; }
    @keyframes sweep { 0% { transform: translateX(-520px); } 55%,100% { transform: translateX(520px); } }
    .bar { animation: bar 1.4s ease-in-out infinite; transform-origin: bottom; transform-box: fill-box; }
    .b2 { animation-delay: -.2s; } .b3 { animation-delay: -.4s; } .b4 { animation-delay: -.6s; } .b5 { animation-delay: -.8s; }
    @keyframes bar { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1600" height="300" fill="url(#bg)"/>
  <rect class="dots" x="-22" y="-22" width="1644" height="344" fill="url(#dots)" opacity=".5"/>
  <circle cx="1480" cy="60" r="260" fill="#ffffff" opacity=".35"/>
  <circle cx="120" cy="290" r="220" fill="#8fd6ea" opacity=".3"/>

  <!-- sparkles -->
  <path class="twinkle" d="M1380 70 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#ffffff"/>
  <path class="twinkle t2" d="M1500 190 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#ffffff"/>
  <path class="twinkle t3" d="M260 60 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#ffffff"/>

  <!-- equaliser bars, the same motif as the logo -->
  <g fill="#1e4a6e" opacity=".85">
    <rect class="bar" x="700" y="235" width="10" height="34" rx="5"/>
    <rect class="bar b2" x="718" y="225" width="10" height="44" rx="5"/>
    <rect class="bar b3" x="736" y="215" width="10" height="54" rx="5"/>
    <rect class="bar b4" x="754" y="225" width="10" height="44" rx="5"/>
    <rect class="bar b5" x="772" y="235" width="10" height="34" rx="5"/>
    <rect class="bar" x="790" y="225" width="10" height="44" rx="5"/>
    <rect class="bar b2" x="808" y="215" width="10" height="54" rx="5"/>
    <rect class="bar b3" x="826" y="225" width="10" height="44" rx="5"/>
    <rect class="bar b4" x="844" y="235" width="10" height="34" rx="5"/>
  </g>

  <g class="title">
    <text x="800" y="170" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="120" letter-spacing="10" fill="#2e6186">AURALYRIC</text>
  </g>
  <g clip-path="url(#textclip)">
    <rect class="sweep" x="520" y="50" width="260" height="200" fill="url(#shine)"/>
  </g>
  <text class="sub" x="800" y="220" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="30" letter-spacing="14" fill="#3d7196">MUSIC, REFINED.</text>
</svg>
